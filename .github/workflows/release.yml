name: Prepare MED release artifacts

# Local/reviewable preparation only; no tags, GitHub releases or publication.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Build and verify MED artifacts
        shell: powershell
        run: ./tools/Build-MEDRelease.ps1
      - name: Require both user artifacts
        shell: powershell
        run: |
          if (!(Test-Path artifacts/releases/MED-1.0.0-win-x64-setup.exe)) {
            throw 'Inno Setup compiler unavailable; installer was not built. No tools are installed by this workflow.'
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MED-1.0.0-win-x64
          path: artifacts/releases/
          if-no-files-found: error
