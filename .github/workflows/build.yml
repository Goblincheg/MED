name: Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.401

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Format Check
      run: dotnet format --verify-no-changes

    - name: Build automated checks
      run: dotnet build tests/EmojiPicker.Checks/EmojiPicker.Checks.csproj -c Release -r win-x64 --self-contained true

    - name: Run automated checks
      run: ./tests/EmojiPicker.Checks/bin/Release/net10.0-windows/win-x64/EmojiPicker.Checks.exe
